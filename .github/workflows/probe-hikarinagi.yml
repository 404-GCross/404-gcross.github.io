name: Probe Hikarinagi

# 临时探测：从 GitHub runner 上看，Hikarinagi 的哪些主机不被 Cloudflare 挑战。
# 用途见 scripts/sync-hikarinagi.mjs 的说明（同步必须能找到一条 runner 可用的路）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosts
        run: |
          for url in \
            "https://www.hikarinagi.org/api/v3/user/45540/statistics" \
            "https://api.hikarinagi.org/v3/galgames/5" \
            "https://api.hikarinagi.org/v3/open/galgames/5" \
            "https://id.hikarinagi.org/oidc/.well-known/openid-configuration" \
            "https://imagesp.yurari.moe/images/531df6a9-db30-4a91-a76d-d13c60b38ede.webp" \
            "https://r.jina.ai/https://www.hikarinagi.org/api/v3/user/45540/statistics" ; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/121 Safari/537.36" --max-time 30 "$url")
            echo "HTTP $code  $url"
            head -c 140 /tmp/out | tr -d '\n'
            echo
            echo "-----"
          done
