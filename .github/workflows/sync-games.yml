name: Sync Hikarinagi games

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # runner 上没有 ImageMagick（实测 convert: command not found），封面合成要用；
      # 已有封面会被脚本跳过，实际只有新增作品才用得到。
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # 带浏览器指纹的取数客户端：Hikarinagi 对数据中心 IP 一律发 Cloudflare 挑战，
      # 裸 curl / Node fetch 都拿不到数据，curl_cffi 可以（实测最新 chrome 与 safari 指纹通过）。
      - name: Install curl_cffi
        run: python3 -m pip install -q --disable-pip-version-check curl_cffi

      # 三档取数：脚本内直连 → curl_cffi 辅助程序 → r.jina.ai。
      # 万一指纹策略变了，这里再装一次真浏览器（Playwright，脚本用真浏览器过 JS 挑战）重试一遍，
      # 日常不装、不跑。
      - name: Sync records
        run: |
          export HIKARINAGI_FETCH_CMD="python3 scripts/fetch-impersonate.py"
          if node scripts/sync-hikarinagi.mjs; then
            exit 0
          fi
          echo "::warning::curl_cffi 通道失败，改用它前先装真浏览器重试"
          npm install --no-save --no-fund --no-audit playwright
          npx playwright install chromium
          HIKARINAGI_FETCH_CMD="node scripts/fetch-via-browser.mjs" node scripts/sync-hikarinagi.mjs

      - name: Commit when the data changed
        run: |
          git config user.name "GCross"
          git config user.email "176783842+404-GCross@users.noreply.github.com"
          git add shirones/config/data/games.ts public/images/games scripts/cache/hikarinagi.json
          if git diff --cached --quiet; then
            echo "记录没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(games): sync the Hikarinagi records"
          git push
