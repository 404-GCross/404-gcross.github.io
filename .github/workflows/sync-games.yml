name: Sync Hikarinagi games

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 站点前有 Cloudflare 挑战（按 IP 信誉判定），先确认 runner 能过再跑同步，
      # 失败时这里会给出可读的状态码，而不是等到脚本里报错。
      - name: Check Hikarinagi reachability
        run: |
          convert -version | head -1
          code=$(curl -s -o /tmp/hikari.json -w "%{http_code}" -A "Mozilla/5.0" \
            "https://www.hikarinagi.org/api/v3/user/45540/statistics")
          echo "Hikarinagi HTTP $code: $(head -c 160 /tmp/hikari.json)"
          test "$code" = "200"

      - name: Sync records
        run: node scripts/sync-hikarinagi.mjs

      - name: Commit when the data changed
        run: |
          git config user.name "GCross"
          git config user.email "176783842+404-GCross@users.noreply.github.com"
          git add shirones/config/data/games.ts public/images/games
          if git diff --cached --quiet; then
            echo "记录没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(games): sync the Hikarinagi records"
          git push
