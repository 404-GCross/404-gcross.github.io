name: Sync Hikarinagi games

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # runner 上没有 ImageMagick（实测 convert: command not found），封面合成要用；
      # 已有封面会被脚本跳过，实际只有新增作品才用得到。
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # Hikarinagi 对数据中心 IP 一律发 Cloudflare 挑战，脚本会直连失败后
      # 改走 r.jina.ai 取正文；这里不预设通道，只看结果。
      - name: Sync records
        run: node scripts/sync-hikarinagi.mjs

      - name: Commit when the data changed
        run: |
          git config user.name "GCross"
          git config user.email "176783842+404-GCross@users.noreply.github.com"
          git add shirones/config/data/games.ts public/images/games scripts/cache/hikarinagi.json
          if git diff --cached --quiet; then
            echo "记录没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(games): sync the Hikarinagi records"
          git push
